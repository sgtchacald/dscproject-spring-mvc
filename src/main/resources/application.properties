#Configuracao Profile
spring.profiles.active=dev

#Versao da aplicacao (filtrado pelo Maven a partir do pom.xml)
app.version=@project.version@

#ADMIN inicial (criado pela carga inicial so quando o banco nao tem usuarios).
# Fornecer via ambiente / .env, nunca versionar a senha:
#   app.admin.login  app.admin.email  app.admin.senha  app.admin.nome
# app.admin.obrigatorio=true faz o boot falhar se faltar a credencial e o banco
# estiver vazio (recomendado em producao). Default: false (so registra aviso).
app.admin.obrigatorio=false
