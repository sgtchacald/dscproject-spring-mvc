#Configuracao Profile
spring.profiles.active=dev

#Versao da aplicacao (filtrado pelo Maven a partir do pom.xml)
app.version=@project.version@

#ADMIN inicial: a carga inicial cria um usuario ADMIN quando NAO ha nenhum ADMIN ativo.
# Credenciais via ambiente / .env (nunca versionar a senha). No .env, use:
#   APP_ADMIN_LOGIN  APP_ADMIN_EMAIL  APP_ADMIN_SENHA  APP_ADMIN_NOME  APP_ADMIN_OBRIGATORIO
# obrigatorio=true faz o boot FALHAR se nao ha ADMIN e a credencial esta ausente
# (recomendado em homologacao/producao). Default abaixo = false (so registra aviso).
app.admin.obrigatorio=false
