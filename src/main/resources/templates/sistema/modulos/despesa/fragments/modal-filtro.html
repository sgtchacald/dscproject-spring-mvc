<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal" class="modal modal-blur fade" id="modalFiltroDespesa" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" th:text="#{despesa.filtro.titulo}">Filtrar despesas</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label" for="filtroBusca" th:text="#{despesa.filtro.campo.busca.label}">Busca</label>
                    <input type="text" class="form-control" id="filtroBusca"
                           th:placeholder="#{despesa.filtro.campo.busca.placeholder}">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="filtroCompetenciaInicio" th:text="#{despesa.filtro.campo.competenciaInicio.label}">Competência inicial</label>
                        <input type="month" class="form-control" id="filtroCompetenciaInicio">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="filtroCompetenciaFim" th:text="#{despesa.filtro.campo.competenciaFim.label}">Competência final</label>
                        <input type="month" class="form-control" id="filtroCompetenciaFim">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="filtroStatus" th:text="#{despesa.filtro.campo.status.label}">Status de pagamento</label>
                        <select class="form-select" id="filtroStatus">
                            <option value="" th:text="#{despesa.filtro.campo.status.todos}">Todos</option>
                            <option value="NAO" th:text="#{despesa.badge.emAberto}">Em aberto</option>
                            <option value="SIM" th:text="#{despesa.badge.paga}">Paga</option>
                            <option value="NAO_SE_APLICA" th:text="#{despesa.badge.naoSeAplica}">Não se aplica</option>
                            <option value="EXCLUIDA" th:text="#{despesa.badge.excluida}">Excluída</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="filtroForma" th:text="#{despesa.filtro.campo.forma.label}">Forma de pagamento</label>
                        <select class="form-select" id="filtroForma">
                            <option value="" th:text="#{despesa.filtro.campo.forma.todas}">Todas</option>
                            <option value="CONTA" th:text="#{despesa.forma.conta}">Conta</option>
                            <option value="CARTAO" th:text="#{despesa.forma.cartao}">Cartão</option>
                            <option value="DINHEIRO" th:text="#{despesa.forma.dinheiro}">Dinheiro</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label" for="filtroCategoria" th:text="#{despesa.filtro.campo.categoria.label}">Categoria</label>
                        <select class="form-select" id="filtroCategoria">
                            <option value="" th:text="#{despesa.filtro.campo.categoria.todas}">Todas as categorias</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="filtroParcelada" th:text="#{despesa.filtro.campo.parcelada.label}">Parcelada</label>
                        <select class="form-select" id="filtroParcelada">
                            <option value="" th:text="#{despesa.filtro.campo.parcelada.todas}">Todas</option>
                            <option value="SIM" th:text="#{despesa.filtro.campo.parcelada.sim}">Sim</option>
                            <option value="NAO" th:text="#{despesa.filtro.campo.parcelada.nao}">Não</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="filtroRecorrente" th:text="#{despesa.filtro.campo.recorrente.label}">Recorrente</label>
                        <select class="form-select" id="filtroRecorrente">
                            <option value="" th:text="#{despesa.filtro.campo.recorrente.todas}">Todas</option>
                            <option value="SIM" th:text="#{despesa.filtro.campo.recorrente.sim}">Sim</option>
                            <option value="NAO" th:text="#{despesa.filtro.campo.recorrente.nao}">Não</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" id="btnLimparFiltro" th:text="#{despesa.filtro.botao.limpar}">Limpar</button>
                <button type="button" class="btn btn-primary" id="btnAplicarFiltro" th:text="#{despesa.filtro.botao.aplicar}">Aplicar</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
