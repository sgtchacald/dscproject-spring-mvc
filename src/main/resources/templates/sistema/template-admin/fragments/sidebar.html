<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>

<aside th:fragment="sidebar" class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
        <!-- BEGIN NAVBAR TOGGLER -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- BEGIN NAVBAR LOGO -->
        <div class="navbar-brand navbar-brand-autodark">
            <img th:src="@{/image/logo.svg}" alt="Logo" />
        </div>

        <!-- BEGIN MENU -->
        <div class="collapse navbar-collapse" id="sidebar-menu"
             th:with="uri=${uriAtual != null ? uriAtual : ''}">
            <ul class="navbar-nav pt-lg-3">
                <li class="nav-item" th:classappend="${uri == '/' or uri == ''} ? 'active'">
                    <a class="nav-link" href="./">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <i class="ph ph-house" aria-hidden="true"></i>
                        </span>
                        <span class="nav-link-title"> Home </span>
                    </a>
                </li>

                <li class="nav-item dropdown"
                    sec:authorize="hasAuthority('PERM_CONTAS_LISTAR') or hasAuthority('PERM_RECEITAS_LISTAR')"
                    th:with="grupoAtivo=${#strings.startsWith(uri, '/contas/') or #strings.startsWith(uri, '/receitas/')}"
                    th:classappend="${grupoAtivo} ? 'active'">
                    <a class="nav-link dropdown-toggle" href="#navbar-financas" data-bs-toggle="dropdown"
                       data-bs-auto-close="false" role="button" aria-expanded="false"
                       th:classappend="${grupoAtivo} ? 'show'" th:attr="aria-expanded=${grupoAtivo}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <i class="ph ph-wallet" aria-hidden="true"></i>
                        </span>
                        <span class="nav-link-title" th:text="#{menu.financas}">Finanças</span>
                    </a>
                    <div class="dropdown-menu" th:classappend="${grupoAtivo} ? 'show'">
                        <a class="dropdown-item" th:href="@{/contas/listar}"
                           sec:authorize="hasAuthority('PERM_CONTAS_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/contas/')} ? 'active'">
                            <i class="ph ph-credit-card dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.contas}">Minhas Contas</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/receitas/listar}"
                           sec:authorize="hasAuthority('PERM_RECEITAS_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/receitas/')} ? 'active'">
                            <i class="ph ph-hand-coins dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.receitas}">Receitas</span>
                        </a>
                    </div>
                </li>

                <li class="nav-item dropdown"
                    sec:authorize="hasAuthority('PERM_USUARIOS_LISTAR') or hasAuthority('PERM_PERFIS_LISTAR') or hasAuthority('PERM_PARAMETROS_LISTAR') or hasAuthority('PERM_CATEGORIAS_LISTAR') or hasAuthority('PERM_CATEGORIAS_PROVEDOR_LISTAR') or hasAuthority('PERM_INSTITUICOES_LISTAR') or hasAuthority('PERM_INSTITUICOES_PROVEDOR_LISTAR')"
                    th:with="grupoAtivo=${#strings.startsWith(uri, '/usuarios/') or #strings.startsWith(uri, '/perfis/') or #strings.startsWith(uri, '/parametros/') or #strings.startsWith(uri, '/categorias/') or #strings.startsWith(uri, '/categorias-provedor/') or #strings.startsWith(uri, '/instituicoes-financeiras/') or #strings.startsWith(uri, '/instituicoes-provedor/')}"
                    th:classappend="${grupoAtivo} ? 'active'">
                    <a class="nav-link dropdown-toggle" href="#navbar-admin" data-bs-toggle="dropdown"
                       data-bs-auto-close="false" role="button" aria-expanded="false"
                       th:classappend="${grupoAtivo} ? 'show'" th:attr="aria-expanded=${grupoAtivo}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <i class="ph ph-gear" aria-hidden="true"></i>
                        </span>
                        <span class="nav-link-title">Administração</span>
                    </a>
                    <div class="dropdown-menu" th:classappend="${grupoAtivo} ? 'show'">
                        <a class="dropdown-item" th:href="@{/usuarios/listar}"
                           sec:authorize="hasAuthority('PERM_USUARIOS_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/usuarios/')} ? 'active'">
                            <i class="ph ph-users dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.usuarios}">Usuários</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/perfis/listar}"
                           sec:authorize="hasAuthority('PERM_PERFIS_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/perfis/')} ? 'active'">
                            <i class="ph ph-shield-check dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.perfis-permissoes}">Perfis e Permissões</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/parametros/listar}"
                           sec:authorize="hasAuthority('PERM_PARAMETROS_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/parametros/')} ? 'active'">
                            <i class="ph ph-sliders-horizontal dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.parametros-globais}">Parâmetros Globais</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/categorias/listar}"
                           sec:authorize="hasAuthority('PERM_CATEGORIAS_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/categorias/')} ? 'active'">
                            <i class="ph ph-tag dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.categorias}">Categorias</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/categorias-provedor/listar}"
                           sec:authorize="hasAuthority('PERM_CATEGORIAS_PROVEDOR_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/categorias-provedor/')} ? 'active'">
                            <i class="ph ph-link dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.categorias-provedor}">Categorias por Provedor</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/instituicoes-financeiras/listar}"
                           sec:authorize="hasAuthority('PERM_INSTITUICOES_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/instituicoes-financeiras/')} ? 'active'">
                            <i class="ph ph-bank dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.instituicoes-financeiras}">Instituições Financeiras</span>
                        </a>
                        <a class="dropdown-item" th:href="@{/instituicoes-provedor/listar}"
                           sec:authorize="hasAuthority('PERM_INSTITUICOES_PROVEDOR_LISTAR')"
                           th:classappend="${#strings.startsWith(uri, '/instituicoes-provedor/')} ? 'active'">
                            <i class="ph ph-plugs-connected dropdown-item-icon" aria-hidden="true"></i>
                            <span th:text="#{menu.instituicoes-provedor}">Instituições por Provedor</span>
                        </a>
                    </div>
                </li>

                <li class="nav-item mt-auto" th:classappend="${#strings.startsWith(uri, '/minha-conta')} ? 'active'">
                    <a class="nav-link" th:href="@{/minha-conta}" th:title="#{minha-conta.pagina.titulo}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <i class="ph ph-user-circle" aria-hidden="true"></i>
                        </span>
                        <span class="nav-link-title" sec:authentication="name">Usuário</span>
                    </a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="nav-link p-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                            <i class="ph ph-sign-out" aria-hidden="true"></i>
                            Sair
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</aside>

</body>
</html>
