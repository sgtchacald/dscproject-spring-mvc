<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>

<aside th:fragment="sidebar" class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
        <!-- BEGIN NAVBAR TOGGLER -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- BEGIN NAVBAR LOGO -->
        <div class="navbar-brand navbar-brand-autodark">
            <img th:src="@{/image/logo.svg}" alt="Logo" />
        </div>

        <!-- BEGIN MENU -->
        <div class="collapse navbar-collapse" id="sidebar-menu">
            <ul class="navbar-nav pt-lg-3">
                <li class="nav-item">
                    <a class="nav-link" href="./">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-1">
                                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                                <polyline points="9 22 9 12 15 12 15 22"/>
                            </svg>
                        </span>
                        <span class="nav-link-title"> Home </span>
                    </a>
                </li>

                <li class="nav-item dropdown"
                    sec:authorize="hasAuthority('PERM_USUARIOS_LISTAR') or hasAuthority('PERM_PERFIS_LISTAR') or hasAuthority('PERM_PARAMETROS_LISTAR')">
                    <a class="nav-link dropdown-toggle" href="#navbar-admin" data-bs-toggle="dropdown"
                       data-bs-auto-close="false" role="button" aria-expanded="false">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" class="icon">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                                <circle cx="9" cy="7" r="4"/>
                                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                            </svg>
                        </span>
                        <span class="nav-link-title">Administração</span>
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" th:href="@{/usuarios/listar}"
                           sec:authorize="hasAuthority('PERM_USUARIOS_LISTAR')">Usuários</a>
                        <a class="dropdown-item" th:href="@{/perfis/listar}"
                           sec:authorize="hasAuthority('PERM_PERFIS_LISTAR')"
                           th:text="#{menu.perfis-permissoes}">Perfis e Permissões</a>
                        <a class="dropdown-item" th:href="@{/parametros/listar}"
                           sec:authorize="hasAuthority('PERM_PARAMETROS_LISTAR')"
                           th:text="#{menu.parametros-globais}">Parâmetros Globais</a>
                    </div>
                </li>

                <li class="nav-item mt-auto">
                    <a class="nav-link" th:href="@{/minha-conta}" th:title="#{minha-conta.pagina.titulo}">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" class="icon">
                                <circle cx="12" cy="12" r="10"/>
                                <circle cx="12" cy="10" r="3"/>
                                <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/>
                            </svg>
                        </span>
                        <span class="nav-link-title" sec:authentication="name">Usuário</span>
                    </a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="nav-link p-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" class="icon">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                <polyline points="16 17 21 12 16 7"/>
                                <line x1="21" x2="9" y1="12" y2="12"/>
                            </svg>
                            Sair
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</aside>

</body>
</html>
