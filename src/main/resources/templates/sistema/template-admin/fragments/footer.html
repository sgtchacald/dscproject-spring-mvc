<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
    <footer class="footer footer-transparent d-print-none" th:fragment="footer">
        <div class="container-xl">
            <div class="row text-center align-items-center flex-row-reverse">
                <div class="col-lg-auto ms-lg-auto" th:if="${redesSociaisUsuario != null and !redesSociaisUsuario.isEmpty()}">
                    <ul class="list-inline list-inline-dots mb-0">
                        <li class="list-inline-item" th:each="rede : ${redesSociaisUsuario}">
                            <a th:href="${rede.url}" target="_blank" class="link-secondary" rel="noopener" th:title="${rede.identificador}">
                                <i th:class="${rede.tipoIcone}" aria-hidden="true"></i>
                                <span th:text="${rede.tipoDescricao}">Rede</span>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="col-12 col-lg-auto mt-3 mt-lg-0">
                    <ul class="list-inline list-inline-dots mb-0">
                        <li class="list-inline-item">
                            Copyright © 2026 <a href="." class="link-secondary">diegocordeiro.com.br</a>. Todos os direitos reservados.
                        </li>
                        <li class="list-inline-item">
                            <a href="./changelog.html" class="link-secondary" rel="noopener" th:text="${appVersao}">v1.0.0</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
