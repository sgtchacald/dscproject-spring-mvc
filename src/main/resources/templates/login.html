<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="#{login.pagina.titulo}">Login</title>
    <link rel="icon" th:href="@{/image/favicon.png}">
    <link th:href="@{/webjars/tabler__core/1.4.0/dist/css/tabler.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>


    </style>
</head>
<body class="antialiased">

<!-- Toasts (canto inferior direito) -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="toastSucesso" class="toast align-items-center text-bg-success border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body fw-medium" th:text="#{toast.cadastro.sucesso}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="esconderToast('toastSucesso')" aria-label="Fechar"></button>
        </div>
    </div>
    <div id="toastLogout" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body fw-medium" th:text="#{toast.logout.sucesso}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="esconderToast('toastLogout')" aria-label="Fechar"></button>
        </div>
    </div>
</div>

<div class="page page-center">
    <div class="container container-tight py-4">

        <div class="text-center mb-4">
            <img th:src="@{/image/logo.svg}" alt="DSCPROJECT" class="navbar-brand-image" style="width: 400px; max-width: 85%; height: auto;">
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible mb-3" role="alert">
            <span th:text="#{login.credenciais.incorretas}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <div class="card card-md">
            <div class="card-body">
                <h2 class="h2 text-center mb-4" th:text="#{login.form.titulo}">Acessar o sistema</h2>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username" th:text="#{login.campo.login.label}">Login</label>
                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               th:placeholder="#{login.campo.login.placeholder}"
                               autofocus
                               autocomplete="username">
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="password" th:text="#{login.campo.senha.label}">Senha</label>
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               th:placeholder="#{login.campo.senha.placeholder}"
                               autocomplete="current-password">
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" class="icon icon-tabler icon-tabler-login-2">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                <path d="M9 8v-2a2 2 0 0 1 2 -2h7a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-7a2 2 0 0 1 -2 -2v-2"/>
                                <path d="M3 12h13l-3 -3"/>
                                <path d="M13 15l3 -3"/>
                            </svg>
                            <span th:text="#{login.botao.entrar}">Entrar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center text-secondary mt-3">
            <span th:text="#{login.nao.tem.conta}">Não tem conta?</span>
            <a href="#" data-bs-toggle="modal" data-bs-target="#modalCadastro" class="fw-bold"
               th:text="#{login.cadastrese}">Cadastre-se</a>
        </div>

        <div class="text-center text-secondary mt-2">
            <p>DSCPROJECT &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span></p>
            <p><a href="./changelog.html" class="link-secondary" rel="noopener" th:text="${appVersao}">v1.0.0</a></p>
        </div>


    </div>
</div>

<!-- Modal de Cadastro -->
<div class="modal modal-blur fade" id="modalCadastro" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" class="icon icon-tabler icon-tabler-user-plus me-2">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/>
                        <path d="M16 19h6"/>
                        <path d="M19 16v6"/>
                        <path d="M6 21v-2a4 4 0 0 1 4 -4h4"/>
                    </svg>
                    <span th:text="#{cadastro.modal.titulo}">Cadastrar Usuário</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>

            <form id="formCadastro" th:action="@{/usuarios/inserir}" method="post" novalidate th:data-erro-comunicacao="#{erro.comunicacao}">

                <div class="modal-body">

                    <!-- Alerta de erros de negócio — aparece somente para erros do servidor -->
                    <div id="alertaErroModal" class="alert alert-danger alert-dismissible" style="display:none;" role="alert">
                        <div class="d-flex align-items-start">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" class="icon alert-icon me-2 flex-shrink-0 mt-1">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                                <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/>
                                <path d="M12 8v4"/>
                                <path d="M12 16h.01"/>
                            </svg>
                            <div id="alertaErroTexto"></div>
                        </div>
                        <button type="button" class="btn-close" onclick="fecharAlertaErro()" aria-label="Fechar"></button>
                    </div>

                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label required" for="nome" th:text="#{cadastro.campo.nome.label}">Nome completo</label>
                            <input type="text"
                                   id="nome"
                                   name="nome"
                                   class="form-control"
                                   th:placeholder="#{cadastro.campo.nome.placeholder}"
                                   maxlength="100"
                                   autocomplete="name">
                            <div class="invalid-feedback" id="erro-nome"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label required" for="genero" th:text="#{cadastro.campo.genero.label}">Gênero</label>
                            <select id="genero" name="genero" class="form-select">
                                <option value="" th:text="#{cadastro.campo.selecione}">Selecione</option>
                                <option th:each="g : ${generos}"
                                        th:value="${g.codigo}"
                                        th:text="${g.descricao}">
                                </option>
                            </select>
                            <div class="invalid-feedback" id="erro-genero"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label required" for="nascimento" th:text="#{cadastro.campo.nascimento.label}">Data de nascimento</label>
                            <input type="date"
                                   id="nascimento"
                                   name="nascimento"
                                   class="form-control"
                                   lang="pt-BR">
                            <div class="invalid-feedback" id="erro-nascimento"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label required" for="email" th:text="#{cadastro.campo.email.label}">E-mail</label>
                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control"
                                   th:placeholder="#{cadastro.campo.email.placeholder}"
                                   maxlength="512"
                                   autocomplete="email">
                            <div class="invalid-feedback" id="erro-email"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label required" for="login" th:text="#{cadastro.campo.login.label}">Login</label>
                            <input type="text"
                                   id="login"
                                   name="login"
                                   class="form-control"
                                   th:placeholder="#{cadastro.campo.login.placeholder}"
                                   maxlength="40"
                                   autocomplete="username">
                            <div class="invalid-feedback" id="erro-login"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label required" for="senha" th:text="#{cadastro.campo.senha.label}">Senha</label>
                            <input type="password"
                                   id="senha"
                                   name="senha"
                                   class="form-control"
                                   th:placeholder="#{cadastro.campo.senha.placeholder}"
                                   autocomplete="new-password">
                            <div class="invalid-feedback" id="erro-senha"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label required" for="confirmacaoSenha" th:text="#{cadastro.campo.confirmacaoSenha.label}">Confirmar senha</label>
                            <input type="password"
                                   id="confirmacaoSenha"
                                   name="confirmacaoSenha"
                                   class="form-control"
                                   th:placeholder="#{cadastro.campo.confirmacaoSenha.placeholder}"
                                   autocomplete="new-password">
                            <div class="invalid-feedback" id="erro-confirmacaoSenha"></div>
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger me-auto"
                            data-bs-dismiss="modal"
                            th:text="#{cadastro.botao.cancelar}">Cancelar</button>
                    <button type="submit" id="btnCadastrar" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round" class="icon icon-tabler icon-tabler-device-floppy">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2"/>
                            <path d="M12 14m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
                            <path d="M14 4l0 4l-6 0l0 -4"/>
                        </svg>
                        <span th:text="#{cadastro.botao.cadastrar}">Cadastrar</span>
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<div id="js-auto-logout" th:if="${param.logout != null}" style="display:none;"></div>
<script th:src="@{/webjars/tabler__core/1.4.0/dist/js/tabler.min.js}"></script>
<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/login.js}"></script>

</body>
</html>
