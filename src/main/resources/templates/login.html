<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="#{login.pagina.titulo}">Login</title>
    <link rel="icon" th:href="@{/image/favicon.png}">
    <link th:href="@{/webjars/tabler__core/1.4.0/dist/css/tabler.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/phosphor-icons__web/2.1.2/src/regular/style.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>


    </style>
</head>
<body class="antialiased">

<!-- Toasts (canto inferior direito) -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="toastSucesso" class="toast align-items-center text-bg-success border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body fw-medium" th:text="#{toast.cadastro.sucesso}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="esconderToast('toastSucesso')" aria-label="Fechar"></button>
        </div>
    </div>
    <div id="toastLogout" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body fw-medium" th:text="#{toast.logout.sucesso}"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="esconderToast('toastLogout')" aria-label="Fechar"></button>
        </div>
    </div>
</div>

<div class="page page-center">
    <div class="container container-tight py-4">

        <div class="text-center mb-4">
            <img th:src="@{/image/logo.svg}" alt="DSCPROJECT" class="navbar-brand-image" style="width: 400px; max-width: 85%; height: auto;">
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible mb-3" role="alert">
            <span th:text="#{login.credenciais.incorretas}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>

        <div class="card card-md">
            <div class="card-body">
                <h2 class="h2 text-center mb-4" th:text="#{login.form.titulo}">Acessar o sistema</h2>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username" th:text="#{login.campo.login.label}">Login</label>
                        <input type="text"
                               id="username"
                               name="username"
                               class="form-control"
                               th:placeholder="#{login.campo.login.placeholder}"
                               autofocus
                               autocomplete="username">
                    </div>
                    <div class="mb-2">
                        <label class="form-label d-flex justify-content-between" for="password">
                            <span th:text="#{login.campo.senha.label}">Senha</span>
                            <a th:href="@{/usuarios/recuperar-senha}" class="text-secondary small"
                               th:text="#{login.esqueci.senha}">Esqueci minha senha</a>
                        </label>
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control"
                               th:placeholder="#{login.campo.senha.placeholder}"
                               autocomplete="current-password">
                    </div>
                    <div class="mb-2">
                        <label class="form-check">
                            <input type="checkbox" class="form-check-input" name="lembrar">
                            <span class="form-check-label" th:text="#{login.lembrar}">Manter-me conectado</span>
                        </label>
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="ph ph-sign-in" aria-hidden="true"></i>
                            <span th:text="#{login.botao.entrar}">Entrar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center text-secondary mt-3">
            <span th:text="#{login.nao.tem.conta}">Não tem conta?</span>
            <a th:href="@{/usuarios/cadastrar-site}" class="fw-bold" th:text="#{login.cadastrese}">Cadastre-se</a>
        </div>

        <div class="text-center text-secondary mt-2">
            <p>DSCPROJECT &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span></p>
            <p><a href="./changelog.html" class="link-secondary" rel="noopener" th:text="${appVersao}">v1.0.0</a></p>
        </div>


    </div>
</div>

<div id="js-auto-logout" th:if="${param.logout != null}" style="display:none;"></div>
<script th:src="@{/webjars/tabler__core/1.4.0/dist/js/tabler.min.js}"></script>
<script th:src="@{/js/script.js}"></script>
<script>
    if (document.getElementById('js-auto-logout')) {
        mostrarToast('toastLogout');
    }
</script>

</body>
</html>
