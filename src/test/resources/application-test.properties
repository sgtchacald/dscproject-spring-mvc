# Perfil de teste — usar SEMPRE junto com o perfil "dev":
#   @ActiveProfiles({"dev", "test"})
# O perfil "dev" (application-dev.properties) fornece as credenciais via ${MYSQL_*},
# carregadas do .env pelo DotenvEnvironmentPostProcessor. Este arquivo, versionado
# e sem segredo, só isola o schema de teste (dsc_test_bd) e o recria a cada execução.

spring.datasource.url=jdbc:mysql://localhost:3306/dsc_test_bd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

# Banco de teste dedicado (dsc_test_bd) — schema mantido por "update".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Sem carga do ADMIN inicial nos testes.
app.admin.login=
app.admin.email=
app.admin.senha=

# Base URL fixa para os asserts do link de recuperação de senha.
app.base-url=http://localhost:8080
