<title>Casos de Uso — Manter Cartão de Crédito</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:#f7f9fb;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2430}
  #diagram{width:1180px;padding:26px 30px 30px}
  h1{font-size:15px;margin:0 0 16px}
  svg{display:block;width:1120px;height:680px}
  .frame{fill:none;stroke:#d8dee6}
  .frame-t{fill:#69747f;font-size:12px;font-weight:700}
  .uc{fill:#fff;stroke:#1f6fd0}
  .uc-t{fill:#1b2430;font-size:11px}
  .lk{stroke:#69747f;stroke-width:1.1}
  .act-t{fill:#1b2430;font-size:11px;font-weight:600}
  .foot{fill:#69747f;font-size:10px}
</style>
<div id="diagram">
  <h1>Casos de Uso — Manter Cartão de Crédito</h1>
  <svg viewBox="0 0 1120 680">
    <rect class="frame" x="360" y="36" width="520" height="600" rx="2"/>
    <text class="frame-t" x="380" y="58">Manter Cartão de Crédito — tela "Meus Cartões"</text>

    <!-- atores -->
    <g transform="translate(120,210)">
      <circle cx="18" cy="10" r="9" fill="none" stroke="#1b2430"/>
      <line x1="18" y1="19" x2="18" y2="44" stroke="#1b2430"/>
      <line x1="4" y1="28" x2="32" y2="28" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="6" y2="64" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="30" y2="64" stroke="#1b2430"/>
      <text class="act-t" x="18" y="82" text-anchor="middle">ADMIN (PERF01)</text>
    </g>
    <g transform="translate(120,420)">
      <circle cx="18" cy="10" r="9" fill="none" stroke="#1b2430"/>
      <line x1="18" y1="19" x2="18" y2="44" stroke="#1b2430"/>
      <line x1="4" y1="28" x2="32" y2="28" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="6" y2="64" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="30" y2="64" stroke="#1b2430"/>
      <text class="act-t" x="18" y="82" text-anchor="middle">USER (PERF02)</text>
    </g>

    <!-- ligações: ambos os perfis têm o mesmo acesso -->
    <g class="lk">
      <line x1="150" y1="245" x2="475" y2="92"/>
      <line x1="150" y1="245" x2="475" y2="182"/>
      <line x1="150" y1="245" x2="475" y2="272"/>
      <line x1="150" y1="245" x2="475" y2="362"/>
      <line x1="150" y1="245" x2="475" y2="452"/>
      <line x1="150" y1="245" x2="475" y2="542"/>
      <line x1="150" y1="455" x2="475" y2="92"/>
      <line x1="150" y1="455" x2="475" y2="182"/>
      <line x1="150" y1="455" x2="475" y2="272"/>
      <line x1="150" y1="455" x2="475" y2="362"/>
      <line x1="150" y1="455" x2="475" y2="452"/>
      <line x1="150" y1="455" x2="475" y2="542"/>
    </g>

    <!-- casos de uso -->
    <g>
      <ellipse class="uc" cx="620" cy="92"  rx="140" ry="25"/><text class="uc-t" x="620" y="96" text-anchor="middle">CAUS01 — Listar Meus Cartões</text>
      <ellipse class="uc" cx="620" cy="182" rx="140" ry="25"/><text class="uc-t" x="620" y="186" text-anchor="middle">CAUS02 — Filtrar Cartões</text>
      <ellipse class="uc" cx="620" cy="272" rx="140" ry="25"/><text class="uc-t" x="620" y="276" text-anchor="middle">CAUS03 — Cadastrar Cartão</text>
      <ellipse class="uc" cx="620" cy="362" rx="140" ry="25"/><text class="uc-t" x="620" y="366" text-anchor="middle">CAUS04 — Editar Cartão</text>
      <ellipse class="uc" cx="620" cy="452" rx="150" ry="27"/><text class="uc-t" x="620" y="449" text-anchor="middle">CAUS05 — Excluir ou</text><text class="uc-t" x="620" y="463" text-anchor="middle">Desativar Cartão</text>
      <ellipse class="uc" cx="620" cy="542" rx="155" ry="29"/><text class="uc-t" x="620" y="539" text-anchor="middle">CAUS06 — Selecionar Cartão</text><text class="uc-t" x="620" y="553" text-anchor="middle">numa Despesa</text>
    </g>

    <text class="foot" x="620" y="642" text-anchor="middle">ADMIN e USER têm o mesmo acesso; cada um opera só sobre os próprios cartões (RN02). CAUS06 usa EDP07 — o cartão é escolhido na tela de Despesa (documento 09).</text>
  </svg>
</div>
