<title>Casos de Uso — Manter Conta</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:#f7f9fb;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2430}
  #diagram{width:1180px;padding:26px 30px 30px}
  h1{font-size:15px;margin:0 0 16px}
  svg{display:block;width:1120px;height:780px}
  .frame{fill:none;stroke:#d8dee6}
  .frame-t{fill:#69747f;font-size:12px;font-weight:700}
  .uc{fill:#fff;stroke:#1f6fd0}
  .uc-t{fill:#1b2430;font-size:11px}
  .lk{stroke:#69747f;stroke-width:1.1}
  .act-t{fill:#1b2430;font-size:11px;font-weight:600}
  .foot{fill:#69747f;font-size:10px}
</style>
<div id="diagram">
  <h1>Casos de Uso — Manter Conta</h1>
  <svg viewBox="0 0 1120 780">
    <rect class="frame" x="360" y="36" width="520" height="700" rx="2"/>
    <text class="frame-t" x="380" y="58">Manter Conta — tela "Minhas Contas"</text>

    <!-- atores -->
    <g transform="translate(120,250)">
      <circle cx="18" cy="10" r="9" fill="none" stroke="#1b2430"/>
      <line x1="18" y1="19" x2="18" y2="44" stroke="#1b2430"/>
      <line x1="4" y1="28" x2="32" y2="28" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="6" y2="64" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="30" y2="64" stroke="#1b2430"/>
      <text class="act-t" x="18" y="82" text-anchor="middle">ADMIN (PERF01)</text>
    </g>
    <g transform="translate(120,470)">
      <circle cx="18" cy="10" r="9" fill="none" stroke="#1b2430"/>
      <line x1="18" y1="19" x2="18" y2="44" stroke="#1b2430"/>
      <line x1="4" y1="28" x2="32" y2="28" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="6" y2="64" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="30" y2="64" stroke="#1b2430"/>
      <text class="act-t" x="18" y="82" text-anchor="middle">USER (PERF02)</text>
    </g>

    <!-- ligações: ambos os perfis têm o mesmo acesso -->
    <g class="lk">
      <line x1="150" y1="285" x2="475" y2="92"/>
      <line x1="150" y1="285" x2="475" y2="182"/>
      <line x1="150" y1="285" x2="475" y2="272"/>
      <line x1="150" y1="285" x2="475" y2="362"/>
      <line x1="150" y1="285" x2="475" y2="452"/>
      <line x1="150" y1="285" x2="475" y2="542"/>
      <line x1="150" y1="285" x2="475" y2="642"/>
      <line x1="150" y1="505" x2="475" y2="92"/>
      <line x1="150" y1="505" x2="475" y2="182"/>
      <line x1="150" y1="505" x2="475" y2="272"/>
      <line x1="150" y1="505" x2="475" y2="362"/>
      <line x1="150" y1="505" x2="475" y2="452"/>
      <line x1="150" y1="505" x2="475" y2="542"/>
      <line x1="150" y1="505" x2="475" y2="642"/>
    </g>

    <!-- casos de uso -->
    <g>
      <ellipse class="uc" cx="620" cy="92"  rx="140" ry="25"/><text class="uc-t" x="620" y="96" text-anchor="middle">CAUS01 — Listar Minhas Contas</text>
      <ellipse class="uc" cx="620" cy="182" rx="140" ry="25"/><text class="uc-t" x="620" y="186" text-anchor="middle">CAUS02 — Filtrar Contas</text>
      <ellipse class="uc" cx="620" cy="272" rx="140" ry="25"/><text class="uc-t" x="620" y="276" text-anchor="middle">CAUS03 — Cadastrar Conta</text>
      <ellipse class="uc" cx="620" cy="362" rx="140" ry="25"/><text class="uc-t" x="620" y="366" text-anchor="middle">CAUS04 — Editar Conta</text>
      <ellipse class="uc" cx="620" cy="452" rx="145" ry="27"/><text class="uc-t" x="620" y="456" text-anchor="middle">CAUS05 — Ajustar Saldo da Conta</text>
      <ellipse class="uc" cx="620" cy="542" rx="150" ry="27"/><text class="uc-t" x="620" y="539" text-anchor="middle">CAUS06 — Excluir ou</text><text class="uc-t" x="620" y="553" text-anchor="middle">Desativar Conta</text>
      <ellipse class="uc" cx="620" cy="642" rx="155" ry="29"/><text class="uc-t" x="620" y="639" text-anchor="middle">CAUS07 — Selecionar Conta</text><text class="uc-t" x="620" y="653" text-anchor="middle">num Lançamento</text>
    </g>

    <text class="foot" x="620" y="722" text-anchor="middle">ADMIN e USER têm o mesmo acesso; cada um opera só sobre as próprias contas (RN02). CAUS07 usa EDP07 — a conta é escolhida nas telas de lançamento (documentos 08 a 11).</text>
  </svg>
</div>
