<title>Casos de Uso — Manter Despesa</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:#f7f9fb;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2430}
  #diagram{width:1300px;padding:26px 30px 30px}
  h1{font-size:15px;margin:0 0 16px}
  svg{display:block;width:1240px;height:1080px}
  .frame{fill:none;stroke:#d8dee6}
  .frame-t{fill:#69747f;font-size:12px;font-weight:700}
  .uc{fill:#fff;stroke:#1f6fd0}
  .uc-t{fill:#1b2430;font-size:11px}
  .lk{stroke:#69747f;stroke-width:1.1}
  .lk.perm{stroke-dasharray:5 4}
  .act-t{fill:#1b2430;font-size:11px;font-weight:600}
  .foot{fill:#69747f;font-size:10px}
</style>
<div id="diagram">
  <h1>Casos de Uso — Manter Despesa</h1>
  <svg viewBox="0 0 1240 1080">
    <rect class="frame" x="380" y="30" width="620" height="960" rx="2"/>
    <text class="frame-t" x="400" y="52">Manter Despesa — tela "Despesas"</text>

    <!-- atores -->
    <g transform="translate(110,300)">
      <circle cx="18" cy="10" r="9" fill="none" stroke="#1b2430"/>
      <line x1="18" y1="19" x2="18" y2="44" stroke="#1b2430"/>
      <line x1="4" y1="28" x2="32" y2="28" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="6" y2="64" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="30" y2="64" stroke="#1b2430"/>
      <text class="act-t" x="18" y="82" text-anchor="middle">ADMIN (PERF01)</text>
    </g>
    <g transform="translate(110,620)">
      <circle cx="18" cy="10" r="9" fill="none" stroke="#1b2430"/>
      <line x1="18" y1="19" x2="18" y2="44" stroke="#1b2430"/>
      <line x1="4" y1="28" x2="32" y2="28" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="6" y2="64" stroke="#1b2430"/>
      <line x1="18" y1="44" x2="30" y2="64" stroke="#1b2430"/>
      <text class="act-t" x="18" y="82" text-anchor="middle">USER (PERF02)</text>
    </g>

    <!-- ligações: CAUS06/07 tracejadas (exigem PERM03) -->
    <g class="lk">
      <line x1="140" y1="335" x2="500" y2="96"/>
      <line x1="140" y1="335" x2="500" y2="192"/>
      <line x1="140" y1="335" x2="500" y2="288"/>
      <line x1="140" y1="335" x2="500" y2="384"/>
      <line x1="140" y1="335" x2="500" y2="480"/>
      <line x1="140" y1="335" x2="500" y2="768"/>
      <line x1="140" y1="335" x2="500" y2="864"/>
      <line x1="140" y1="335" x2="500" y2="960"/>
      <line x1="140" y1="655" x2="500" y2="96"/>
      <line x1="140" y1="655" x2="500" y2="192"/>
      <line x1="140" y1="655" x2="500" y2="288"/>
      <line x1="140" y1="655" x2="500" y2="384"/>
      <line x1="140" y1="655" x2="500" y2="480"/>
      <line x1="140" y1="655" x2="500" y2="768"/>
      <line x1="140" y1="655" x2="500" y2="864"/>
      <line x1="140" y1="655" x2="500" y2="960"/>
    </g>
    <g class="lk perm">
      <line x1="140" y1="335" x2="500" y2="576"/>
      <line x1="140" y1="335" x2="500" y2="672"/>
      <line x1="140" y1="655" x2="500" y2="576"/>
      <line x1="140" y1="655" x2="500" y2="672"/>
    </g>

    <!-- casos de uso -->
    <g>
      <ellipse class="uc" cx="650" cy="96"  rx="150" ry="27"/><text class="uc-t" x="650" y="100" text-anchor="middle">CAUS01 — Listar Minhas Despesas</text>
      <ellipse class="uc" cx="650" cy="192" rx="150" ry="27"/><text class="uc-t" x="650" y="196" text-anchor="middle">CAUS02 — Filtrar Despesas</text>
      <ellipse class="uc" cx="650" cy="288" rx="160" ry="27"/><text class="uc-t" x="650" y="292" text-anchor="middle">CAUS03 — Cadastrar Despesa à Vista</text>
      <ellipse class="uc" cx="650" cy="384" rx="165" ry="27"/><text class="uc-t" x="650" y="388" text-anchor="middle">CAUS04 — Cadastrar Despesa no Cartão</text>
      <ellipse class="uc" cx="650" cy="480" rx="165" ry="27"/><text class="uc-t" x="650" y="484" text-anchor="middle">CAUS05 — Cadastrar Despesa Parcelada</text>
      <ellipse class="uc" cx="650" cy="576" rx="175" ry="30"/><text class="uc-t" x="650" y="572" text-anchor="middle">CAUS06 — Ratear Despesa</text><text class="uc-t" x="650" y="586" text-anchor="middle">entre Usuários  (PERM03)</text>
      <ellipse class="uc" cx="650" cy="672" rx="175" ry="30"/><text class="uc-t" x="650" y="668" text-anchor="middle">CAUS07 — Registrar Acerto</text><text class="uc-t" x="650" y="682" text-anchor="middle">de Fatia  (PERM03)</text>
      <ellipse class="uc" cx="650" cy="768" rx="140" ry="27"/><text class="uc-t" x="650" y="772" text-anchor="middle">CAUS08 — Editar Despesa</text>
      <ellipse class="uc" cx="650" cy="864" rx="165" ry="27"/><text class="uc-t" x="650" y="868" text-anchor="middle">CAUS09 — Excluir Despesa ou Série</text>
      <ellipse class="uc" cx="650" cy="960" rx="150" ry="27"/><text class="uc-t" x="650" y="964" text-anchor="middle">CAUS10 — Registrar Pagamento</text>
    </g>

    <text class="foot" x="650" y="1050" text-anchor="middle">ADMIN e USER têm o mesmo acesso; cada um opera só sobre as próprias despesas (RN02).</text>
    <text class="foot" x="650" y="1066" text-anchor="middle">CAUS06/CAUS07 (linha tracejada) exigem, além do perfil, DESPESA_RATEAR_MULTIUSUARIO — concedida por plano pago (RN15).</text>
  </svg>
</div>
